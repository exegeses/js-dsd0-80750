<body>

    <h2>desde 1995 hasta 2015</h2>
    <section>

        <hr>
        <i class="item">item 1</i>
        <i class="item">item 2</i>
        <i class="item">item 3</i>

        <b>negrita</b>
        <b>negrita</b>

        <input type="text" name="nombre">
    </section>

    <h2>desde 2015</h2>
    <span id="cajaTexto"></span>
    <section>
        <p>soy un p</p>
        <p>soy otro p</p>
    </section>


    <script src="js/seleccionar.js"></script>
</body>
</html>
